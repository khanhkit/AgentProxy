name: Build App

# Manual-only since #11946. Historical push-triggered builds suffered repeated memory
# shutdowns and produced an artifact no downstream job consumed. The canonical build is
# ci.yml `Build`, which now runs exclusively on GitHub-hosted x64 with the memory-safe
# webpack/one-worker path. Dispatch this workflow only when a standalone build artifact
# is explicitly needed.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Fast Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app & CLI bundle
        run: |
          npm run build:release
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
          OMNIROUTE_BUILD_MEMORY_MB: "12288"
          OMNIROUTE_USE_TURBOPACK: "1"

      - name: Archive build outputs
        run: |
          tar -czf omniroute-build.tar.gz .build dist

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omniroute-build
          path: omniroute-build.tar.gz
          retention-days: 7
