name: Node Compatibility

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-compat:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.22.2"
            pin_authoritative_npm: "true"
          - node: "24.15.0"
            pin_authoritative_npm: "true"
          - node: "25.0.0"
            # npm 12.0.2 rejects Node 25.x; this lane validates runtime compatibility.
            pin_authoritative_npm: "false"
          - node: "26.0.0"
            pin_authoritative_npm: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run check:toolchain-contract
      - uses: $/.github/actions/npm-ci-retry
        with:
          pin_authoritative_npm: ${{ matrix.pin_authoritative_npm }}
      - run: npm run check:node-runtime
      - run: npm run typecheck:core
