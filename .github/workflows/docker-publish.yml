name: Publish AgentProxy Container

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Container tag to publish (for example 0.1.1-rc.1 or edge)"
        required: true
        default: "edge"
        type: string
      promote_latest:
        description: "Also publish :latest"
        required: false
        default: false
        type: boolean

concurrency:
  group: agentproxy-container-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve container metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      promote_latest: ${{ steps.meta.outputs.promote_latest }}
    steps:
      - id: meta
        name: Resolve version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.promote_latest }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "release" ] && [ "$REF_NAME" != "refs/heads/main" ]; then
            echo "::error::Manual container publication is only allowed from main"
            exit 1
          fi
          if [ "$EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
            if [ "${RELEASE_PRERELEASE:-false}" = "false" ]; then
              promote_latest=true
            else
              promote_latest=false
            fi
          else
            version="${INPUT_VERSION#v}"
            promote_latest="${INPUT_LATEST:-false}"
          fi
          if ! printf '%s' "$version" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::Invalid container tag: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "promote_latest=$promote_latest" >> "$GITHUB_OUTPUT"

  build:
    name: Build AgentProxy (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # Required to push platform image digests to GHCR.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agentproxy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Add build swap
        shell: bash
        run: |
          set -euo pipefail
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner-base
          platforms: ${{ matrix.platform }}
          build-args: |
            AGENTPROXY_USE_TURBOPACK=0
            AGENTPROXY_BUILD_MEMORY_MB=7168
            AGENTPROXY_BUILD_WORKERS=2
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ env.IMAGE_NAME }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=agentproxy-${{ matrix.arch }}
          cache-to: type=gha,scope=agentproxy-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Smoke platform image
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${DIGEST}"
          docker pull "$image_ref"
          docker rm -f agentproxy-smoke 2>/dev/null || true
          trap 'docker logs agentproxy-smoke 2>/dev/null || true; docker rm -f agentproxy-smoke 2>/dev/null || true' EXIT
          docker run -d --name agentproxy-smoke \
            -p 127.0.0.1:20128:20128 \
            -p 127.0.0.1:20129:20129 \
            -e AGENTPROXY_AUTH_DISABLED=1 \
            "$image_ref"
          for attempt in $(seq 1 120); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:20128/readyz >/dev/null \
              && curl --fail --silent --max-time 2 http://127.0.0.1:20129/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "::error::AgentProxy container did not become ready"
              exit 1
            fi
            sleep 1
          done
          docker exec agentproxy-smoke test -x /app/rust/target/release/agentproxy-gateway
          curl --fail --silent http://127.0.0.1:20128/healthz
          curl --fail --silent http://127.0.0.1:20128/readyz
          curl --fail --silent http://127.0.0.1:20129/healthz

      - name: Scan platform image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentproxy-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # Required to create and push the multi-arch manifest in GHCR.
      id-token: write # Required for keyless Cosign signing and GitHub artifact attestations.
      attestations: write
      artifact-metadata: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agentproxy
      VERSION: ${{ needs.prepare.outputs.version }}
      PROMOTE_LATEST: ${{ needs.prepare.outputs.promote_latest }}
    steps:
      - name: Harden publish runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentproxy-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find /tmp/digests -type f | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "::error::Expected exactly 2 platform digests, got ${#digest_files[@]}"
            exit 1
          fi
          refs=()
          for digest_file in "${digest_files[@]}"; do
            refs+=("${IMAGE_NAME}@sha256:$(basename "$digest_file")")
          done
          tags=(-t "${IMAGE_NAME}:${VERSION}")
          if [ "$PROMOTE_LATEST" = "true" ]; then
            tags+=(-t "${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}"

      - name: Verify manifest platforms
        shell: bash
        run: |
          set -euo pipefail
          raw=$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --raw)
          grep -qE '"architecture"[[:space:]]*:[[:space:]]*"amd64"' <<<"$raw"
          grep -qE '"architecture"[[:space:]]*:[[:space:]]*"arm64"' <<<"$raw"

      - name: Resolve immutable manifest digest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          inspect=$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}")
          digest=$(awk '$1 == "Digest:" && !seen {print $2; seen=1}' <<<"$inspect")
          if ! grep -qE '^sha256:[0-9a-f]{64}$' <<<"$digest"; then
            echo "::error::Unable to resolve immutable manifest digest"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest immutable multi-arch manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Sign multi-arch manifest with GitHub OIDC
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      - name: Verify multi-arch manifest signature
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign verify "${IMAGE_NAME}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\\.github/workflows/docker-publish\\.yml@refs/(heads/main|tags/v.*)$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
