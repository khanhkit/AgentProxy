name: Portable CI Dispatcher
run-name: portable-dispatch/${{ inputs.logical_task }}/${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      logical_task:
        required: true
        type: choice
        options: [test-vitest]
      source_sha:
        required: true
        type: string
      benchmark_mode:
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write
  statuses: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Select first available compatible runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOGICAL_TASK: ${{ inputs.logical_task }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_REF: ${{ github.ref_name }}
          BENCHMARK_MODE: ${{ inputs.benchmark_mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be an exact 40-character lowercase commit SHA"
            exit 2
          fi
          args=(
            node scripts/ci/github-runner-fallback.mjs
            --logical-task "$LOGICAL_TASK"
            --source-sha "$SOURCE_SHA"
            --workflow-ref "$WORKFLOW_REF"
          )
          if [[ "$BENCHMARK_MODE" == "true" ]]; then
            args+=(--benchmark)
          fi
          "${args[@]}"
