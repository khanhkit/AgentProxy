name: CodeQL

# Advanced CodeQL is the authoritative repository scanner. GitHub default setup is
# intentionally not configured; this workflow owns automatic JS/TS analysis.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Upload SARIF and read analysis/alert state.
      actions: read # Required by CodeQL to inspect workflow metadata.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          # Keep the default query suite so results remain comparable across scans.
          languages: javascript-typescript
          # Add only the bundled alert-suppression query pack entry; default queries remain enabled.
          packs: codeql/javascript-queries@*:AlertSuppression.ql

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:javascript-typescript"
          # Keep failed-run diagnostics, but route successful SARIF through the generic
          # in-source suppression filter before the authoritative upload.
          upload: failure-only
          post-processed-sarif-path: ../results-post-processed

      - name: Honor CodeQL in-source suppressions
        run: >-
          node scripts/check/filter-codeql-in-source-suppressions.mjs
          ../results-post-processed
          ../results-filtered

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ../results-filtered
          category: "/language:javascript-typescript"

      - name: Verify fresh CodeQL analysis and PR-local regression
        env:
          GH_TOKEN: ${{ github.token }}
          CODEQL_RATCHET_ENFORCE: "1"
          CODEQL_EXPECTED_SHA: ${{ github.sha }}
          CODEQL_EXPECTED_REF: ${{ github.ref }}
          CODEQL_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run check:codeql-ratchet
