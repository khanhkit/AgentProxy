name: OCR Failed Coverage Rescan
run-name: ocr-failed-coverage/pr104/${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current default-branch SHA to scan
        required: true
        type: string

permissions: {}

concurrency:
  group: ocr-failed-coverage-pr104
  cancel-in-progress: false

jobs:
  scan:
    name: Rescan PR104 failed OCR coverage
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Validate exact default-branch source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const sourceSha = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              throw new Error('source_sha must be a full lowercase commit SHA');
            }
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (repository.default_branch !== 'main') {
              throw new Error(`Expected default branch main, got ${repository.default_branch}`);
            }
            const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: repository.default_branch });
            if (main.commit.sha !== sourceSha) {
              throw new Error(`source_sha ${sourceSha} is not the current default-branch head ${main.commit.sha}`);
            }

      - name: Checkout exact trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate bounded 53-file manifest
        shell: bash
        env:
          EXPECTED_COUNT: "53"
          MANIFEST: .github/ocr/audits/pr104-run37959118532-failed-53.txt
        run: |
          set -euo pipefail
          mapfile -t paths < <(sed '/^[[:space:]]*$/d' "$MANIFEST")
          if [[ "${#paths[@]}" -ne "$EXPECTED_COUNT" ]]; then
            echo "::error::Expected ${EXPECTED_COUNT} OCR paths, got ${#paths[@]}"
            exit 1
          fi
          declare -A seen=()
          for path in "${paths[@]}"; do
            if [[ "$path" = /* || "$path" == *".."* || "$path" == *","* ]]; then
              echo "::error::Unsafe OCR path in manifest: $path"
              exit 1
            fi
            if [[ -n "${seen[$path]:-}" ]]; then
              echo "::error::Duplicate OCR path in manifest: $path"
              exit 1
            fi
            seen[$path]=1
            git ls-files --error-unmatch -- "$path" >/dev/null || {
              echo "::error::OCR path is not tracked at source_sha: $path"
              exit 1
            }
          done
          SCAN_PATHS="$(IFS=,; echo "${paths[*]}")"
          echo "SCAN_PATHS=$SCAN_PATHS" >> "$GITHUB_ENV"

      - name: Detect OCR configuration
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_AUTH_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$OCR_LLM_URL" ]] || missing+=("OCR_LLM_URL")
          [[ -n "$OCR_LLM_AUTH_TOKEN" ]] || missing+=("OCR_LLM_AUTH_TOKEN")
          [[ -n "$OCR_LLM_MODEL" ]] || missing+=("OCR_LLM_MODEL")
          [[ -n "$OCR_LLM_USE_ANTHROPIC" ]] || missing+=("OCR_LLM_USE_ANTHROPIC")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::OpenCodeReview configuration unavailable; missing required names: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install OpenCodeReview 1.12.13
        shell: bash
        run: npm install -g "@alibaba-group/open-code-review@1.12.13"

      - name: Configure OpenCodeReview
        shell: bash
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL }}
          OCR_LLM_USE_ANTHROPIC: ${{ vars.OCR_LLM_USE_ANTHROPIC }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$OCR_LLM_USE_ANTHROPIC" | tr '[:upper:]' '[:lower:]')"
          case "$normalized" in
            true|1|yes) protocol=anthropic; use_anthropic=true ;;
            *) protocol=openai; use_anthropic=false ;;
          esac
          ocr config unset provider
          ocr config set llm.auth_token ""
          ocr config set llm.url "$OCR_LLM_URL"
          ocr config set llm.model "$OCR_LLM_MODEL"
          ocr config set llm.use_anthropic "$use_anthropic"
          ocr config set llm.protocol "$protocol"
          ocr config set llm.auth_token_cmd 'printf "%s" "$OCR_LLM_TOKEN"'

      - name: Run bounded 53-file OCR scan
        shell: bash
        env:
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_TIMEOUT: "300"
        run: |
          set +e
          ocr scan --path "${SCAN_PATHS}" --format json --output /tmp/ocr-result.json 2>/tmp/ocr-stderr.log
          code=$?
          set -e
          echo "OCR_EXIT_CODE=$code" >> "$GITHUB_ENV"
          cat /tmp/ocr-stderr.log >&2 || true

      - name: Upload bounded scan artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-failed-coverage-pr104-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/ocr-result.json
            /tmp/ocr-stderr.log
          if-no-files-found: warn

      - name: Fail on OCR command error
        if: env.OCR_EXIT_CODE != '0'
        shell: bash
        run: exit "${OCR_EXIT_CODE}"

      - name: Require complete OCR coverage
        if: env.OCR_EXIT_CODE == '0'
        shell: bash
        run: node scripts/ci/validate-ocr-result.mjs /tmp/ocr-result.json
