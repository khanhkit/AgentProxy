name: npm ci with retry
description: >-
  Install dependencies. Restores node_modules from the Actions cache when the exact
  lockfile / runner / Node version / postinstall inputs match; otherwise runs npm ci
  with retries for transient registry/network failures and saves the tree for the
  next run.
inputs:
  cache:
    description: Set to "false" to skip the node_modules cache and always run npm ci.
    required: false
    default: "true"
  pin_authoritative_npm:
    description: >-
      Set to "false" only for an explicit runtime-compatibility lane whose Node
      release is rejected by the authoritative npm version.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Pin authoritative npm
      if: inputs.pin_authoritative_npm == 'true'
      shell: bash
      run: |
        set -euo pipefail

        node_version="$(node --version)"
        if [[ "$node_version" == "v22.22.2" ]]; then
          # Node 22.22.2 bundles npm 10.9.7, whose in-place global self-upgrade
          # can fail with MODULE_NOT_FOUND: promise-retry. Corepack is bundled
          # with Node 22 and can fetch/run the project-pinned npm without asking
          # npm 10.9.7 to overwrite itself.
          corepack install --global npm@12.0.2
          corepack_bin="$RUNNER_TEMP/agentproxy-corepack-npm"
          mkdir -p "$corepack_bin"
          corepack enable --install-directory "$corepack_bin" npm
          echo "$corepack_bin" >> "$GITHUB_PATH"
          export PATH="$corepack_bin:$PATH"
          test "$(corepack npm --version)" = "12.0.2"
        else
          npm install -g npm@12.0.2 --no-audit --no-fund
        fi

        test "$(npm --version)" = "12.0.2"

    - name: Resolve Node version for the cache key
      id: node
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

    # #8084 D3 (plan 3.8.51 task 5): every job used to pay ~80-90 s of `npm ci` even
    # with setup-node's npm tarball cache warm — 36 jobs per ci.yml run, ~55 min of
    # runner time per run just installing. A node_modules cache keyed on EVERYTHING
    # that shapes the tree lets a hit skip the install entirely.
    #
    # No restore-keys on purpose (same rule as the ESLint cache, #11600): a partial
    # tree from another lockfile / Node / postinstall script is exactly the kind of
    # silent drift a lockfile-pinned CI must never inherit. Exact key or a full npm ci.
    #
    # postinstall (scripts/build/postinstall.mjs + helpers) only mutates node_modules
    # on a plain install — its dist/ branch is gated on dist/ existing, which never
    # holds at install time in CI — so the cached tree already carries its effects.
    - name: Restore node_modules
      id: node-modules
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.version }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc', 'scripts/build/postinstall.mjs', 'scripts/build/postinstallSupport.mjs', 'scripts/build/colocateOptionals.mjs', 'scripts/build/wreqJsNative.mjs', 'scripts/build/fixPlaywrightAndroid.mjs', 'scripts/build/native-binary-compat.mjs') }}

    - name: npm ci (with retry)
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail

        max_attempts=3
        delay_seconds=20

        for attempt in $(seq 1 "$max_attempts"); do
          if [ "$attempt" -gt 1 ]; then
            echo "npm ci attempt $attempt/$max_attempts after transient failure"
          fi

          # --no-audit: `audit:deps` is its own gate; the inline audit only adds latency.
          if npm ci --no-audit --no-fund; then
            exit 0
          fi

          exit_code=$?
          if [ "$attempt" -eq "$max_attempts" ]; then
            exit "$exit_code"
          fi

          sleep "$delay_seconds"
          delay_seconds=$((delay_seconds * 2))
        done

    - name: node_modules restored from cache
      if: steps.node-modules.outputs.cache-hit == 'true'
      shell: bash
      run: echo "node_modules restored from cache (key hit) — npm ci skipped"
