[package]
name = "agentproxy-rust-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
agentproxy-account = { path = "../../rust/crates/account" }
agentproxy-providers = { path = "../../rust/crates/providers" }
agentproxy-stream = { path = "../../rust/crates/stream" }
agentproxy-control-protocol = { path = "../../rust/crates/control-protocol" }
agentproxy-gateway = { path = "../../rust/crates/gateway" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
async-stream = "0.3"
http-body-util = "0.1"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"

tokio-tungstenite = "0.29"
futures-util = "0.3"
