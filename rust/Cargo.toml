[workspace]
resolver = "2"
members = ["crates/stream", "crates/providers", "crates/account", "crates/control-protocol", "crates/gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
