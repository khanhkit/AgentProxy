[package]
name = "agentproxy-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arc-swap = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
httpdate = "1"
agentproxy-account = { path = "../account" }
agentproxy-control-protocol = { path = "../control-protocol" }
agentproxy-providers = { path = "../providers" }
agentproxy-stream = { path = "../stream" }
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"

[lints]
workspace = true
